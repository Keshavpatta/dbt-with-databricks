version: 2

models:
    - name: bronze_date
      config:
        materialized: view 
    - name: bronze_store
      config:
        materialized: view
      columns:
        - name: store_name
          data_tests:
            - accepted_values:
                arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                  values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
                config:
                  severity: warn
    - name: bronze_sales
      columns:
        - name: sales_id
          data_tests:
            - unique
            - not_null
        - name: gross_amount
          data_tests:
            - generic_non_negative
    